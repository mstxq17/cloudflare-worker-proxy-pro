name = "cloudflare-worker-proxy-pro"
main = "worker.js"
compatibility_date = "2026-05-04"
compatibility_flags = ["nodejs_compat"]

# Production deployment template.
# Keep real domain, KV namespace id, and ADMIN secret out of the public repository.
# Copy this block to wrangler.local.toml, uncomment it, and fill real values locally.

# workers_dev = true

# Recommended for this project: exact Custom Domains. The Worker is the origin
# for these hostnames, so do not add /* and do not use a wildcard unless you
# really want every subdomain captured by this Worker.
# [[routes]]
# pattern = "example.com"
# custom_domain = true
#
# [[routes]]
# pattern = "admin.example.com"
# custom_domain = true
#
# [[routes]]
# pattern = "proxy.example.com"
# custom_domain = true
#
# [[routes]]
# pattern = "gh.example.com"
# custom_domain = true
#
# Classic Routes also work, but each hostname must have a proxied DNS record:
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" },
#   { pattern = "gh.example.com/*", zone_name = "example.com" }
# ]

# [vars]
# MAIN_DOMAIN = "example.com"
# ADMIN_SUBDOMAIN = "admin"
# LANDING_SUBDOMAIN = "proxy"
# Do not store the real admin password in wrangler.toml.
# Configure it with: npx wrangler secret put ADMIN --config wrangler.local.toml
# ADMIN = "set-with-wrangler-secret"

# [[kv_namespaces]]
# binding = "KV"
# id = "your-kv-namespace-id"
