name = "cloudflare-worker-proxy-pro"
main = "worker.js"
compatibility_date = "2026-05-04"

# Required runtime variables:
# MAIN_DOMAIN = "rad0.indevs.in"
# ADMIN should be configured as a secret in Cloudflare Dashboard or with wrangler secret.
# Optional runtime variables:
# ADMIN_SUBDOMAIN = "admin"
# LANDING_SUBDOMAIN = "proxy"

# Bind a Cloudflare KV namespace before deployment.
# Dashboard can bind by namespace selection; wrangler.toml requires the real namespace id.
# [[kv_namespaces]]
# binding = "KV"
# id = "your-real-kv-namespace-id"
